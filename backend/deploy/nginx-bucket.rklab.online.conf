# /etc/nginx/sites-available/vault.rklab.online
# Cloudflare Tunnel should point this hostname at http://127.0.0.1:80
# (or https://127.0.0.1:443 if you terminate TLS on nginx).

server {
    listen 80;
    listen [::]:80;
    server_name bucket.rklab.online;

    client_max_body_size 32m;

    # Live admin alerts (Server-Sent Events) — must not buffer.
    location = /admin/passwords/send-requests/stream {
        proxy_pass http://127.0.0.1:8076;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8076;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
