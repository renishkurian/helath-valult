<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter PIN — Vault</title>
<meta name="theme-color" content="#0A0C11">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/vault.css?v=6">
</head>
<body>
<div class="public-wrap">
  <div class="public-card">
    <div class="public-brand">
      <span class="brand-mark">V</span>
      <span class="brand-name">Vault</span>
    </div>

    <div class="card">
      <div class="card-body text-center">
        <span class="card-ico gold mx-auto"><i class="bi bi-lock-fill"></i></span>
        <div class="eyebrow justify-content-center mt-3">Private share</div>
        <h1 class="page-title">PIN required</h1>
        <p class="page-lead mx-auto mb-4">This shared link is locked. Ask the owner for the PIN.</p>

        {% if error %}
        <div class="alert alert-danger text-start" role="alert">
          <i class="bi bi-exclamation-triangle"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="get" action="{% if kind=='pack' %}/share/public/pack/{{ token }}/page{% else %}/share/public/{{ token }}/page{% endif %}">
          <label class="form-label" for="pin">PIN</label>
          <input class="form-control form-control-lg text-center" id="pin" name="pin" type="password"
                 inputmode="numeric" autocomplete="one-time-code" autofocus>
          <button class="btn btn-primary btn-lg btn-block mt-3" type="submit">
            <i class="bi bi-unlock-fill"></i> Open
          </button>
        </form>
      </div>
    </div>

    <div class="public-foot">
      <i class="bi bi-shield-lock"></i>
      Read-only link. Access is logged for the owner.
    </div>
  </div>
</div>
</body>
</html>
