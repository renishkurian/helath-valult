<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter PIN — Vault</title>
<meta name="theme-color" content="#0B1018">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/vault.css?v=3">
<style>
  body{ min-height:100vh; display:flex; align-items:center; padding:32px 20px; }
  .card{ max-width:400px; margin:0 auto; width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:40px 36px; }
  h1{ font-family:var(--display); font-size:36px; font-weight:400; font-style:italic; letter-spacing:-0.03em; margin-bottom:10px; }
  p{ color:var(--ink-soft); font-size:14px; margin-bottom:22px; line-height:1.5; }
  input{ text-align:center; letter-spacing:0.35em; font-size:20px; }
  button{ margin-top:8px; width:100%; }
  .err{ color:#FB7185; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Private share</div>
    <h1>PIN required</h1>
    <p>This shared link is locked. Ask the owner for the PIN.</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="get" action="{% if kind=='pack' %}/share/public/pack/{{ token }}/page{% else %}/share/public/{{ token }}/page{% endif %}">
      <input name="pin" type="password" inputmode="numeric" autocomplete="one-time-code" autofocus>
      <button class="btn" type="submit">Open</button>
    </form>
  </div>
</body>
</html>
