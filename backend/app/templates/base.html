<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Health Vault{% endblock %} — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#F3EEE3; --paper-deep:#EAE2D0; --ink:#21281F; --ink-soft:#5B6152;
    --navy:#2C4256; --navy-deep:#1E313F; --stamp:#B23B36; --sage:#5E7C50;
    --sage-bg:#E4EADB; --mustard:#C68A2E; --mustard-bg:#F5E7CC; --line:#D9CDAE; --white:#FCFAF4;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--paper); color:var(--ink); }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .slab{ font-family:'Roboto Slab', serif; }

  .shell{ display:flex; min-height:100vh; }

  /* ---- Sidebar ---- */
  .sidebar{
    width:220px; flex-shrink:0; background:var(--navy-deep); color:var(--white);
    padding:26px 20px; display:flex; flex-direction:column;
  }
  .brand{ font-family:'Roboto Slab', serif; font-weight:700; font-size:18px; margin-bottom:2px; }
  .brand-sub{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:1.5px; color:#8FA2B0; text-transform:uppercase; margin-bottom:32px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
    font-size:13.5px; color:#C7D2D9; margin-bottom:4px;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); }
  .nav-item.active{ background:rgba(255,255,255,0.1); color:var(--white); font-weight:500; }
  .sidebar-footer{ margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.12); }
  .sidebar-footer a{ font-size:12.5px; color:#8FA2B0; }

  /* ---- Main ---- */
  .main{ flex:1; padding:32px 40px; max-width:1180px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .page-title{ font-family:'Roboto Slab', serif; font-size:28px; font-weight:700; margin-bottom:24px; }

  /* ---- Cards / surfaces ---- */
  .surface{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .grid{ display:grid; gap:20px; }
  .grid-cards{ grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }

  /* ---- Health ID card ---- */
  .id-card{
    position:relative; border-radius:16px; padding:20px;
    background:linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%); color:var(--white);
    box-shadow:0 10px 24px rgba(30,49,63,0.28);
  }
  .id-card .hosp{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:#B9C7D2; }
  .id-card .label{ font-family:'Roboto Slab', serif; font-weight:600; font-size:14px; margin-top:2px; }
  .id-card .stamp{
    float:right; width:48px; height:48px; border-radius:50%; border:1.4px solid var(--stamp); color:var(--stamp);
    font-family:'IBM Plex Mono', monospace; font-size:7px; font-weight:600; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; transform:rotate(-10deg);
  }
  .id-card .name{ font-family:'Roboto Slab', serif; font-size:17px; font-weight:700; margin-top:16px; }
  .id-card .pid{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#B9C7D2; margin-top:2px; }
  .id-card .meta-row{ display:flex; gap:20px; margin-top:14px; padding-top:12px; border-top:1px dashed rgba(255,255,255,0.25); }
  .id-card .meta-label{ font-size:9px; text-transform:uppercase; letter-spacing:0.8px; color:#8FA2B0; font-family:'IBM Plex Mono', monospace; }
  .id-card .meta-value{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; margin-top:2px; }
  .id-card form{ margin-top:14px; }
  .id-card .btn-del{ background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); color:var(--white); font-size:11.5px; padding:6px 10px; border-radius:7px; cursor:pointer; }

  /* ---- Family chips ---- */
  .family-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:26px; }
  .chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px 8px 8px; border-radius:999px;
    background:var(--white); border:1.5px solid var(--line); font-size:13px; font-weight:500;
  }
  .chip.active{ border-color:var(--navy); background:var(--navy); color:var(--white); }
  .chip .avatar{ width:26px; height:26px; border-radius:50%; background:var(--paper-deep); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--ink); }
  .chip.active .avatar{ background:rgba(255,255,255,0.2); color:var(--white); }

  /* ---- Folder tabs ---- */
  .folders{ display:flex; gap:0; margin-bottom:28px; flex-wrap:wrap; }
  .folder{
    width:120px; height:78px; margin-right:-16px; padding:12px 12px 8px 22px;
    clip-path:polygon(0 16px, 16px 0, 100% 0, 100% 100%, 0 100%);
    display:flex; flex-direction:column; justify-content:space-between; font-size:12.5px; font-weight:600;
  }
  .folder .fcount{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:400; color:var(--ink-soft); }

  /* ---- Ledger table ---- */
  .ledger{ width:100%; border-collapse:collapse; }
  .ledger th{ text-align:left; font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); padding:10px 14px; border-bottom:1px solid var(--line); }
  .ledger td{ padding:12px 14px; border-bottom:1px solid var(--paper-deep); font-size:13.5px; vertical-align:middle; }
  .ledger tr:last-child td{ border-bottom:none; }
  .doc-icon{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:7px; color:var(--white); font-family:'IBM Plex Mono', monospace; font-size:9px; font-weight:600; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; padding:3px 8px; border-radius:5px; font-weight:500; }
  .tag-sage{ background:var(--sage-bg); color:var(--sage); }
  .tag-mustard{ background:var(--mustard-bg); color:var(--mustard); }

  /* ---- Alerts ---- */
  .alert{ display:flex; align-items:center; gap:10px; background:var(--mustard-bg); border:1px solid #E0C083; border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:13px; color:#5A4419; }
  .alert .dot{ width:8px; height:8px; border-radius:50%; background:var(--mustard); flex-shrink:0; }

  /* ---- Forms ---- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  input[type=text], input[type=date], input[type=datetime-local], input[type=email], input[type=password], select, textarea, input[type=file]{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--white);
    font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; color:var(--ink);
  }
  .field{ margin-bottom:12px; }
  .btn{ background:var(--navy); color:var(--white); border:none; padding:10px 18px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-outline{ background:transparent; border:1.4px solid var(--navy); color:var(--navy); padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; }
  details summary{ cursor:pointer; font-weight:600; color:var(--navy); margin-bottom:14px; font-size:13.5px; }

  .section-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .section-head h2{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-soft); font-weight:500; }

  .empty{ color:var(--ink-soft); font-size:13.5px; padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="brand">Health Vault</div>
    <div class="brand-sub">Admin</div>
    {% if session_user %}
    <a class="nav-item {% if active_nav=='dashboard' %}active{% endif %}" href="/admin{% if active_person_id %}?person={{ active_person_id }}{% endif %}">Dashboard</a>
    <a class="nav-item {% if active_nav=='family' %}active{% endif %}" href="/admin/family">Family</a>
    <a class="nav-item {% if active_nav=='reminders' %}active{% endif %}" href="/admin/reminders{% if active_person_id %}?person={{ active_person_id }}{% endif %}">Reminders</a>
    <div class="sidebar-footer">
      <div style="font-size:12.5px; color:#C7D2D9; margin-bottom:8px;">{{ session_user.full_name }}</div>
      <a href="/admin/logout">Log out →</a>
    </div>
    {% endif %}
  </div>
  <div class="main">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
