<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send — {{ title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0B14">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
  @font-face{
    font-family:'Inter';
    src:url('/static/fonts/inter-latin.woff2') format('woff2');
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Fraunces';
    src:url('/static/fonts/fraunces-latin.woff2') format('woff2');
    font-weight:500 600; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    src:url('/static/fonts/ibm-plex-mono-latin-400.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    src:url('/static/fonts/ibm-plex-mono-latin-500.woff2') format('woff2');
    font-weight:500; font-style:normal; font-display:swap;
  }
  :root{
    --bg: #0A0B14;
    --glass: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.09);
    --border-hover: rgba(255,255,255,0.18);
    --ink: #F1EFE8;
    --ink-dim: #8B8DA0;
    --ink-faint: #565A6E;
    --primary: #F0A94E;
    --steel: #3A3D4E;
    --steel-lt: #565A70;
    --v-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --v-display:'Fraunces',Georgia,'Times New Roman',serif;
    --v-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--v-sans, 'Inter', sans-serif);
    overflow:hidden;
  }

  .mesh{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .mesh::before{
    content:''; position:absolute; width:70vw; height:70vw; border-radius:50%;
    background: radial-gradient(circle, var(--primary), transparent 70%);
    filter: blur(150px); opacity:0.07;
    top:18%; left:50%; transform: translate(-50%,-50%);
  }

  .stage{
    position: relative; z-index:1;
    height: 100dvh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 24px; text-align:center;
  }

  .scene{ width: 210px; height: 210px; margin-bottom: 6px; }
  .scene svg{ width:100%; height:100%; overflow: visible; }
  .scene.is-idle{ animation: scene-sway 4s ease-in-out infinite alternate; }

  .eyebrow{
    font-family: var(--v-mono, 'IBM Plex Mono', monospace);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--primary); margin-bottom: 14px;
    opacity:0; transform: translateY(10px);
  }
  h1{
    font-family: var(--v-display, 'Fraunces', serif);
    font-weight: 500; font-size: clamp(26px, 5vw, 34px);
    letter-spacing: -0.01em; margin-bottom: 12px; max-width: 560px;
    opacity:0; transform: translateY(10px);
  }
  p.body{
    color: var(--ink-dim); font-size: 14.5px; line-height:1.6;
    max-width: 440px; margin-bottom: 30px;
    opacity:0; transform: translateY(10px);
  }

  .actions{ display:flex; flex-wrap:wrap; gap: 12px; justify-content:center; opacity:0; transform: translateY(10px); }
  .btn{
    font-family: inherit; font-size:13.5px; font-weight:600; border-radius:10px;
    padding:12px 22px; display:inline-flex; align-items:center; gap:8px;
    cursor:pointer; border:1px solid var(--border); background: var(--glass);
    color:var(--ink); text-decoration:none; transition: background .18s ease, border-color .18s ease, filter .18s ease;
  }
  .btn:hover{ background: rgba(255,255,255,0.075); border-color: var(--border-hover); color: var(--ink); }
  .btn.primary{ background: var(--primary); color:#1c1406; border-color: var(--primary); }
  .btn.primary:hover{ filter: brightness(1.08); }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  .tag{
    margin-top: 26px; display:inline-flex; align-items:center; gap:8px;
    font-family: var(--v-mono, 'IBM Plex Mono', monospace);
    font-size: 10.5px; letter-spacing:0.08em; color: var(--ink-faint);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
    opacity:0; transform: translateY(10px);
  }
  .tag .dot{
    width:6px; height:6px; border-radius:50%; background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
  }

  .reveal{ opacity:1 !important; transform: translateY(0) !important; transition: opacity .5s ease, transform .5s ease; }

  #glintGroup{ transform-origin: 0px 0px; animation: glint-spin 6s linear infinite; }
  #keyhole.is-alive{
    transform-origin: 0px -4px;
    animation: keyhole-breathe 1.8s ease-in-out infinite alternate;
  }

  @keyframes glint-spin{ to{ transform: rotate(360deg); } }
  @keyframes keyhole-breathe{ to{ transform: scale(1.08); } }
  @keyframes scene-sway{ to{ transform: rotate(0.6deg); } }

  @media (prefers-reduced-motion: reduce){
    .scene.is-idle, #glintGroup, #keyhole.is-alive{ animation: none; }
    .eyebrow, h1, p.body, .actions, .tag{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="mesh" aria-hidden="true"></div>

<div class="stage">
  <div class="scene" id="scene" aria-hidden="true">
    <svg viewBox="-105 -105 210 210">
      <defs>
        <radialGradient id="hubGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#4a4d61"/>
          <stop offset="100%" stop-color="#1b1c26"/>
        </radialGradient>
        <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#565A70"/>
          <stop offset="100%" stop-color="#3A3D4E"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#F0A94E" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#F0A94E" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <circle cx="0" cy="0" r="96" fill="none" stroke="#20212c" stroke-width="14"/>
      <circle cx="0" cy="0" r="96" fill="none" stroke="#33344230" stroke-width="1"/>

      <g id="glintGroup">
        <circle cx="0" cy="-96" r="5" fill="#ffffff" opacity="0.55" filter="blur(2px)"/>
      </g>

      <g id="bolts"></g>

      <circle id="hub" cx="0" cy="0" r="30" fill="url(#hubGrad)" stroke="#4a4d61" stroke-width="1"/>
      <circle id="hubGlow" cx="0" cy="0" r="40" fill="url(#glow)" opacity="0"/>

      <g id="keyhole" opacity="0">
        <circle cx="0" cy="-4" r="5.5" fill="#0d0d13"/>
        <path d="M -3.6 0 L 3.6 0 L 6 14 L -6 14 Z" fill="#0d0d13"/>
      </g>
    </svg>
  </div>

  <div class="eyebrow" id="eyebrow">{{ eyebrow }}</div>
  <h1 id="heading">{{ heading }}</h1>
  <p class="body" id="bodytext">{{ body }}</p>

  <div class="actions" id="actions">
    <a class="btn primary" href="/admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Vault
    </a>
    <span class="btn" role="note">Ask sender for a new link</span>
  </div>

  <div class="tag" id="tag"><span class="dot" aria-hidden="true"></span>{{ tag }}</div>
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';
  var boltsGroup = document.getElementById('bolts');
  var boltCount = 8;
  var doorR = 89;
  var lockedR = 34;
  var boltLen = 30;
  var boltW = 11;
  var boltState = [];
  var i;

  for (i = 0; i < boltCount; i++) {
    var angle = (360 / boltCount) * i;
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', 'rotate(' + angle + ')');

    var rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', String(-boltLen / 2));
    rect.setAttribute('y', String(-boltW / 2));
    rect.setAttribute('width', String(boltLen));
    rect.setAttribute('height', String(boltW));
    rect.setAttribute('rx', '2.5');
    rect.setAttribute('fill', 'url(#boltGrad)');
    rect.setAttribute('stroke', '#12131a');
    rect.setAttribute('stroke-width', '1');

    var inner = document.createElementNS(NS, 'g');
    inner.appendChild(rect);
    g.appendChild(inner);
    boltsGroup.appendChild(g);
    boltState.push({ inner: inner, r: doorR });
  }

  function renderBolts() {
    boltState.forEach(function (b) {
      b.inner.setAttribute('transform', 'translate(' + b.r + ',0)');
    });
  }
  renderBolts();

  function easeOutBack(t) {
    var c1 = 1.70158;
    var c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function animateBolt(b, delayMs, durationMs) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        var start = performance.now();
        var from = b.r;
        var to = lockedR;
        function frame(now) {
          var t = Math.min(1, (now - start) / durationMs);
          b.r = from + (to - from) * easeOutBack(t);
          renderBolts();
          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      }, delayMs);
    });
  }

  function fadeGlow() {
    var glow = document.getElementById('hubGlow');
    glow.setAttribute('opacity', '0.9');
    var start = performance.now();
    function frame(now) {
      var t = Math.min(1, (now - start) / 700);
      glow.setAttribute('opacity', String(0.9 * (1 - t)));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function revealText() {
    ['eyebrow', 'heading', 'bodytext', 'actions', 'tag'].forEach(function (id, idx) {
      setTimeout(function () {
        var el = document.getElementById(id);
        if (el) el.classList.add('reveal');
      }, idx * 80);
    });
  }

  if (reduce) {
    boltState.forEach(function (b) { b.r = lockedR; });
    renderBolts();
    document.getElementById('keyhole').setAttribute('opacity', '0.9');
    revealText();
    return;
  }

  setTimeout(function () {
    var locks = boltState.map(function (b, idx) {
      return animateBolt(b, idx * 60, 550);
    });
    Promise.all(locks).then(function () {
      fadeGlow();
      var keyhole = document.getElementById('keyhole');
      keyhole.setAttribute('opacity', '0.9');
      keyhole.classList.add('is-alive');
      document.getElementById('scene').classList.add('is-idle');
      revealText();
    });
  }, 300);
})();
</script>

</body>
</html>
