<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — Sign in</title>
<meta name="theme-color" content="#0B1018">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/vault.css?v=4">
<style>
  html, body{ height:100%; }
  body{ display:grid; grid-template-columns:1.1fr 0.9fr; min-height:100vh; min-height:100dvh; padding:0; }
  .hero{
    display:flex; flex-direction:column; justify-content:space-between;
    padding:48px 56px 40px; border-right:1px solid var(--line);
    background:var(--navy-deep);
  }
  .hero h1{
    font-family:var(--display); font-size:clamp(4.5rem, 12vw, 9rem);
    font-weight:400; font-style:italic; letter-spacing:-0.05em; line-height:0.85;
    margin-top:auto;
  }
  .hero p{ max-width:18em; color:var(--ink-soft); font-size:15px; line-height:1.6; margin-top:28px; }
  .form-side{
    display:flex; align-items:center; justify-content:center;
    padding:48px 40px;
  }
  .box{ width:min(380px, 100%); }
  .box h2{ font-family:var(--display); font-size:40px; font-weight:400; font-style:italic; letter-spacing:-0.03em; margin:8px 0 8px; }
  .box .sub{ color:var(--ink-soft); font-size:14px; margin-bottom:32px; line-height:1.55; }
  .box .btn{ width:100%; }
  .error{ color:#FB7185; font-size:13px; margin-bottom:14px; }
  @media (max-width: 820px){
    body{ grid-template-columns:1fr; }
    .hero{ min-height:38vh; padding:32px 24px 28px; border-right:none; border-bottom:1px solid var(--line); }
    .hero h1{ font-size:4.2rem; margin-top:24px; }
    .form-side{ padding:32px 24px 48px; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="eyebrow">Private household archive</div>
    <div>
      <h1>Vault</h1>
      <p>Health, secrets, money, papers, and links — kept on your own server.</p>
    </div>
  </section>
  <section class="form-side">
    <div class="box">
      <div class="eyebrow">Sign in</div>
      <h2>Welcome back</h2>
      <p class="sub">Use the email and password for this vault.</p>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/login">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Enter</button>
      </form>
    </div>
  </section>
</body>
</html>
