<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — Sign in</title>
<meta name="theme-color" content="#0B0F17">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Plus Jakarta Sans', system-ui, sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; color:#F4F6FA;
    background:
      radial-gradient(900px 500px at 20% 0%, rgba(91,140,255,0.22), transparent 50%),
      radial-gradient(700px 400px at 90% 100%, rgba(61,220,151,0.12), transparent 45%),
      #0B0F17;
  }
  .box{
    width:min(400px, calc(100% - 32px)); background:rgba(21,27,40,0.9);
    border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:36px 32px;
    box-shadow:0 30px 80px rgba(0,0,0,0.45);
  }
  .mark{
    width:44px; height:44px; border-radius:12px; margin-bottom:18px;
    background:linear-gradient(135deg, #5B8CFF, #7A6CFF);
    display:grid; place-items:center; font-weight:700; color:#fff;
    box-shadow:0 10px 24px rgba(91,140,255,0.35);
  }
  .eyebrow{ font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8B95A8; font-weight:600; margin-bottom:8px; }
  h1{ font-size:28px; letter-spacing:-0.04em; margin-bottom:8px; }
  .sub{ color:#8B95A8; font-size:14px; margin-bottom:24px; }
  label{ font-size:12px; color:#8B95A8; display:block; margin-bottom:6px; font-weight:500; }
  input{
    width:100%; padding:12px 14px; border:1px solid rgba(255,255,255,0.08); border-radius:12px;
    font-size:15px; margin-bottom:14px; background:#0F1522; color:#F4F6FA; font-family:inherit; outline:none;
  }
  input:focus{ border-color:#5B8CFF; box-shadow:0 0 0 3px rgba(91,140,255,0.2); }
  .btn{
    width:100%; background:linear-gradient(180deg,#6B98FF,#4E7FFF); color:#fff; border:none;
    padding:13px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;
    box-shadow:0 10px 22px rgba(91,140,255,0.3);
  }
  .error{ color:#FF6B7A; font-size:13px; margin-bottom:12px; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">V</div>
    <div class="eyebrow">Vault</div>
    <h1>Welcome back</h1>
    <p class="sub">Health records and passwords, on your own server.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required>
      <button class="btn" type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
