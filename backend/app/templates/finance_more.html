{% extends "base.html" %}
{% block title %}More{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">Money Manager</div>
    <div class="page-title">Settings</div>
  </div>
</div>

<div class="more-grid">
  <a class="more-tile" href="/admin/finance/recurring">
    <div class="ico" style="color:var(--mm-expense);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 10h16M4 14h10"/><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4"/></svg></div>
    <span>Recurring</span>
  </a>
  <a class="more-tile" href="/admin/finance/ai">
    <div class="ico" style="color:var(--navy);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    <span>AI & SMS</span>
  </a>
  <a class="more-tile" href="/admin/finance/accounts">
    <div class="ico" style="color:var(--mustard);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><ellipse cx="12" cy="7" rx="8" ry="3"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/></svg></div>
    <span>Accounts</span>
  </a>
  <a class="more-tile" href="/admin/finance/categories">
    <div class="ico" style="color:var(--sage);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 7h16M4 12h10M4 17h7"/></svg></div>
    <span>Categories</span>
  </a>
  <a class="more-tile" href="/admin/finance/plan">
    <div class="ico" style="color:#A89BFF;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></div>
    <span>Budgets</span>
  </a>
  <a class="more-tile" href="/admin/storage">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v8h8"/></svg></div>
    <span>Backup</span>
  </a>
  <a class="more-tile" href="/admin/modules">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
    <span>Modules</span>
  </a>
</div>

{% if summary.pending_messages %}
<p style="margin-top:18px; color:var(--ink-soft);">{{ summary.pending_messages }} SMS waiting to be tagged in <a href="/admin/finance/ai" style="color:var(--navy);">AI & SMS</a>.</p>
{% endif %}
{% endblock %}
