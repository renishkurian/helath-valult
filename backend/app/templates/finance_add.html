{% extends "base.html" %}
{% block title %}{{ txn_type|capitalize }}{% endblock %}
{% block content %}
<div class="entry-page">
  <a class="entry-back" href="/admin/finance">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    Trans.
  </a>
  <h1 class="entry-title">{{ txn_type|capitalize }}</h1>

  <div class="entry-types" data-kind="{{ txn_type }}">
    <a class="{% if txn_type=='income' %}on{% endif %}" href="/admin/finance/add?txn_type=income{% if prefill_account_id %}&account_id={{ prefill_account_id }}{% endif %}">Income</a>
    <a class="{% if txn_type=='expense' %}on{% endif %}" href="/admin/finance/add?txn_type=expense{% if prefill_account_id %}&account_id={{ prefill_account_id }}{% endif %}">Expense</a>
    <a class="{% if txn_type=='transfer' %}on{% endif %}" href="/admin/finance/add?txn_type=transfer{% if prefill_account_id %}&account_id={{ prefill_account_id }}{% endif %}">Transfer</a>
  </div>

  <form method="post" action="/admin/finance/add" class="entry-card" enctype="multipart/form-data" id="entry-form">
    <input type="hidden" name="txn_type" value="{{ txn_type }}">
    <input type="hidden" name="account_id" id="account_id" value="{{ prefill_account_id or (accounts[0].id if accounts else '') }}">
    {% if txn_type=='transfer' %}
    <input type="hidden" name="to_account_id" id="to_account_id" value="{{ accounts[1].id if accounts|length > 1 else (accounts[0].id if accounts else '') }}">
    {% endif %}
    <input type="hidden" name="category_id" id="category_id" value="">
    <input type="hidden" name="payment_method" id="payment_method" value="other">

    <div class="entry-field date-field">
      <span class="k">Date</span>
      <div class="when">
        <label class="when-chip" id="date-row">
          <span id="date-label">—</span>
          <input type="date" name="txn_date" id="txn_date" value="{{ today }}">
        </label>
        <label class="when-chip" id="time-row">
          <span id="time-label">—</span>
          <input type="time" name="txn_time" id="txn_time" value="{{ now }}">
        </label>
      </div>
    </div>

    <button type="button" class="entry-field" id="account-row" data-sheet="account">
      <span class="k">{% if txn_type=='transfer' %}From{% else %}Account{% endif %}</span>
      <span class="v" id="account-label">Select</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    {% if txn_type=='transfer' %}
    <button type="button" class="entry-field" id="to-account-row" data-sheet="to">
      <span class="k">To account</span>
      <span class="v" id="to-account-label">Select</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    {% else %}
    <button type="button" class="entry-field" id="category-row" data-sheet="category">
      <span class="k">Category</span>
      <span class="v" id="category-label">Select</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    {% endif %}

    <label class="entry-field amount-field">
      <span class="k">Amount</span>
      <span class="amount-wrap"><span class="rupee">₹</span><input type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00" inputmode="decimal"></span>
    </label>

    <button type="button" class="entry-field" id="method-row" data-sheet="method">
      <span class="k">Paid by</span>
      <span class="v" id="method-label">Other</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <label class="entry-field">
      <span class="k">Note</span>
      <input type="text" name="payee" placeholder="Swiggy, salary, Mixi…">
    </label>

    <div class="entry-field desc-field">
      <span class="k">Description</span>
      <textarea name="description" rows="2" placeholder="Optional details"></textarea>
      <label class="cam" title="Attach receipt">
        <input type="file" name="image" accept="image/*" id="receipt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </label>
    </div>
    <div class="receipt-name" id="receipt-name" hidden></div>

    <button class="entry-save" type="submit">Save {{ txn_type }}</button>
  </form>
</div>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden data-kind="{{ txn_type }}">
  <div class="sheet-head">
    <strong id="sheet-title">Select</strong>
    <button type="button" class="sheet-x" id="sheet-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<style>
  .entry-page{ max-width:560px; }
  .entry-back{ display:inline-flex; align-items:center; gap:4px; color:var(--ink-soft); font-size:13px; font-weight:600; margin-bottom:10px; }
  .entry-back:hover{ color:var(--ink); }
  .entry-title{ font-size:34px; letter-spacing:-0.05em; font-weight:800; margin-bottom:18px; }
  .entry-types{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:18px; }
  .entry-types a{
    text-align:center; padding:11px 8px; border-radius:12px; border:1px solid var(--line);
    background:rgba(21,27,40,0.7); color:var(--ink-soft); font-weight:700; font-size:14px;
    transition:border-color .18s var(--ease), color .18s var(--ease), background .18s var(--ease);
  }
  .entry-types[data-kind="income"] a.on{ color:var(--mm-income); border-color:var(--mm-income); background:rgba(91,156,255,0.12); }
  .entry-types[data-kind="expense"] a.on{ color:var(--mm-expense); border-color:var(--mm-expense); background:rgba(255,107,122,0.12); }
  .entry-types[data-kind="transfer"] a.on{ color:var(--mm-transfer); border-color:var(--mm-transfer); background:rgba(168,155,255,0.12); }
  .entry-card{
    background:rgba(21,27,40,0.88); border:1px solid var(--line); border-radius:22px;
    padding:6px 20px 22px; box-shadow:var(--shadow); backdrop-filter:blur(16px);
  }
  .entry-field{
    display:grid; grid-template-columns:92px 1fr auto; gap:10px; align-items:center;
    width:100%; padding:16px 0; border:0; border-bottom:1px solid var(--line);
    background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer;
  }
  .entry-field:last-of-type{ border-bottom:none; }
  .entry-field .k{ font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); }
  .entry-field .v, .entry-field input, .entry-field textarea{
    border:0; background:transparent; padding:0; box-shadow:none; font-size:16px; font-weight:600; color:var(--ink);
  }
  .entry-field input:focus, .entry-field textarea:focus{ box-shadow:none; border:0; }
  .entry-field .chev{ width:16px; height:16px; color:var(--ink-soft); }
  .date-field{ grid-template-columns:92px 1fr; cursor:default; }
  .when{ display:flex; gap:8px; justify-content:flex-end; }
  .when-chip{
    position:relative; overflow:hidden;
    border:1px solid var(--line); background:rgba(255,255,255,0.04); color:var(--ink);
    border-radius:10px; padding:8px 12px; font:inherit; font-weight:650; font-size:14px; cursor:pointer;
  }
  .when-chip:hover{ border-color:rgba(244,240,230,0.35); }
  .when-chip input{ position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; border:0; }
  .amount-field{ grid-template-columns:92px 1fr; }
  .amount-wrap{ display:flex; align-items:baseline; gap:6px; }
  .rupee{ font-size:22px; font-weight:700; color:var(--ink-soft); }
  .amount-wrap input{ font-size:28px; font-weight:800; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; }
  .desc-field{ grid-template-columns:92px 1fr auto; align-items:start; }
  .desc-field textarea{ min-height:52px; resize:vertical; font-weight:500; }
  .cam{
    width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; margin:0;
  }
  .cam input{ display:none; }
  .cam:hover{ color:var(--ink); border-color:rgba(244,240,230,0.4); }
  .receipt-name{ font-size:12px; color:var(--sage); padding:0 0 12px 102px; }
  .entry-save{
    width:100%; margin-top:18px; border:0; border-radius:14px; padding:15px;
    font-size:16px; font-weight:700; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#FF8A96,#FF6B7A); box-shadow:0 12px 24px rgba(255,107,122,0.28);
  }
  .entry-types[data-kind="income"] ~ .entry-card .entry-save{ background:linear-gradient(180deg,#7EB0FF,#5B9CFF); box-shadow:0 12px 24px rgba(91,156,255,0.28); }
  .entry-types[data-kind="transfer"] ~ .entry-card .entry-save{ background:linear-gradient(180deg,#B8AEFF,#A89BFF); box-shadow:0 12px 24px rgba(168,155,255,0.28); }
  .sheet-scrim{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; backdrop-filter:blur(4px); }
  .sheet-scrim[hidden], .sheet[hidden]{ display:none !important; }
  .sheet{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:min(560px, 100%); max-height:78vh; z-index:41;
    background:#141418; border:1px solid var(--line); border-bottom:0;
    border-radius:22px 22px 0 0; box-shadow:0 -20px 50px rgba(0,0,0,0.45);
    display:flex; flex-direction:column; animation:sheetIn .22s var(--ease);
  }
  @keyframes sheetIn{ from{ transform:translateX(-50%) translateY(24px); opacity:0; } to{ transform:translateX(-50%) translateY(0); opacity:1; } }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; }
  .sheet-x{ width:36px; height:36px; border:0; border-radius:10px; background:rgba(255,255,255,0.05); color:var(--ink); cursor:pointer; }
  .sheet-body{ overflow:auto; padding:8px 16px 28px; }
  .tile-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .tile{
    min-height:52px; border-radius:12px; border:1px solid var(--line); background:transparent;
    color:var(--ink); font:inherit; font-weight:600; cursor:pointer; padding:12px 8px;
  }
  .tile:hover{ border-color:rgba(255,255,255,0.2); }
  .tile.on{ border-color:var(--mm-expense); background:rgba(255,107,122,0.14); }
  .sheet[data-kind="income"] .tile.on{ border-color:var(--mm-income); background:rgba(91,156,255,0.14); }
  .sheet[data-kind="transfer"] .tile.on{ border-color:var(--mm-transfer); background:rgba(168,155,255,0.14); }
  .sheet[data-kind="income"] .cat-item.on{ background:var(--mm-income); }
  .sheet[data-kind="income"] .cat-item.pick{ color:var(--mm-income); }
  .cat-split{ display:grid; grid-template-columns:1fr 1fr; min-height:280px; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  .cat-col{ overflow:auto; max-height:360px; }
  .cat-col:first-child{ background:#0C0C10; border-right:1px solid var(--line); }
  .cat-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    width:100%; padding:14px; border:0; background:transparent; color:var(--ink);
    font:inherit; text-align:left; cursor:pointer;
  }
  .cat-item.on{ background:var(--mm-expense); color:#fff; }
  .cat-item.pick{ color:var(--mm-expense); font-weight:700; }
</style>
<script>
const CATS = {{ cats_json|safe }};
const ACCTS = {{ accts_json|safe }};
const KIND = "{{ txn_type }}";
const METHODS = [
  ["upi","UPI"],["debit_card","Debit card"],["credit_card","Credit card"],
  ["atm","ATM cash"],["netbanking","Net banking"],["cash","Cash"],["other","Other"]
];
const scrim = document.getElementById("scrim");
const sheet = document.getElementById("sheet");
const body = document.getElementById("sheet-body");
const title = document.getElementById("sheet-title");

function acctName(id){ return (ACCTS.find(a => a.id === id) || {}).name || "Select"; }
function visibleCats(){
  const acc = document.getElementById("account_id").value;
  return CATS.filter(c => c.kind === KIND && (!c.account_id || c.account_id === acc));
}
function catLabel(){
  const id = document.getElementById("category_id").value;
  const c = CATS.find(x => x.id === id);
  if(!c) return "Select";
  if(c.parent_id){
    const p = CATS.find(x => x.id === c.parent_id);
    return p ? p.name + " › " + c.name : c.name;
  }
  return c.name;
}
function formatDate(){
  const d = document.getElementById("txn_date").value;
  if(!d) return "Pick date";
  return new Date(d + "T12:00:00").toLocaleDateString(undefined, { day:"2-digit", month:"short", year:"numeric" });
}
function formatTime(){
  const t = document.getElementById("txn_time").value || "00:00";
  const [h,m] = t.split(":").map(Number);
  const dt = new Date(); dt.setHours(h||0, m||0, 0, 0);
  return dt.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}
function syncLabels(){
  document.getElementById("date-label").textContent = formatDate();
  document.getElementById("time-label").textContent = formatTime();
  document.getElementById("account-label").textContent = acctName(document.getElementById("account_id").value);
  const to = document.getElementById("to_account_id");
  if(to) document.getElementById("to-account-label").textContent = acctName(to.value);
  const cat = document.getElementById("category-label");
  if(cat) cat.textContent = catLabel();
  const m = document.getElementById("payment_method").value;
  document.getElementById("method-label").textContent = (METHODS.find(x => x[0]===m)||[,"Other"])[1];
}
function closeSheet(){ scrim.hidden = true; sheet.hidden = true; }
function openSheet(name, html){
  title.textContent = name;
  body.innerHTML = html;
  scrim.hidden = false;
  sheet.hidden = false;
}
function tileHtml(items, selected, kind){
  return `<div class="tile-grid">${items.map(([id,label]) =>
    `<button type="button" class="tile ${id===selected?"on":""}" data-pick="${kind}" data-id="${id}">${label}</button>`
  ).join("")}</div>`;
}
function openAccounts(which){
  const selected = document.getElementById(which === "to" ? "to_account_id" : "account_id").value;
  openSheet(which === "to" ? "To account" : "Accounts",
    tileHtml(ACCTS.map(a => [a.id, a.name]), selected, which === "to" ? "to" : "account"));
}
function openMethods(){
  openSheet("Paid by", tileHtml(METHODS, document.getElementById("payment_method").value, "method"));
}
function openCategories(){
  const all = visibleCats();
  const parents = all.filter(c => !c.parent_id);
  const selected = document.getElementById("category_id").value;
  const sel = all.find(c => c.id === selected);
  const parentId = (sel && sel.parent_id) || (sel && sel.id) || (parents[0] && parents[0].id) || "";
  const kids = all.filter(c => c.parent_id === parentId);
  const parent = parents.find(p => p.id === parentId);
  const left = parents.map(p =>
    `<button type="button" class="cat-item ${p.id===parentId?"on":""}" data-parent="${p.id}">${p.name}<span>›</span></button>`
  ).join("");
  let right = parent
    ? `<button type="button" class="cat-item ${selected===parent.id?"pick":""}" data-pick="category" data-id="${parent.id}">${parent.name}</button>`
    : "";
  kids.forEach(c => {
    right += `<button type="button" class="cat-item ${selected===c.id?"pick":""}" data-pick="category" data-id="${c.id}">${c.name}</button>`;
  });
  openSheet("Category", `<div class="cat-split"><div class="cat-col">${left}</div><div class="cat-col">${right}</div></div>`);
}
document.getElementById("txn_date").addEventListener("change", syncLabels);
document.getElementById("txn_time").addEventListener("change", syncLabels);
document.getElementById("account-row")?.addEventListener("click", () => openAccounts("from"));
document.getElementById("to-account-row")?.addEventListener("click", () => openAccounts("to"));
document.getElementById("category-row")?.addEventListener("click", openCategories);
document.getElementById("method-row")?.addEventListener("click", openMethods);
document.getElementById("sheet-close").addEventListener("click", closeSheet);
scrim.addEventListener("click", closeSheet);
body.addEventListener("click", (ev) => {
  const parentBtn = ev.target.closest("[data-parent]");
  if(parentBtn){
    const id = parentBtn.getAttribute("data-parent");
    const kids = visibleCats().filter(c => c.parent_id === id);
    if(!kids.length){
      document.getElementById("category_id").value = id;
      syncLabels(); closeSheet(); return;
    }
    document.getElementById("category_id").value = id;
    openCategories();
    return;
  }
  const pick = ev.target.closest("[data-pick]");
  if(!pick) return;
  const kind = pick.getAttribute("data-pick");
  const id = pick.getAttribute("data-id");
  if(kind === "account"){
    document.getElementById("account_id").value = id;
    const cat = document.getElementById("category_id");
    if(cat){ const still = visibleCats().some(c => c.id === cat.value); if(!still) cat.value = ""; }
  }
  if(kind === "to") document.getElementById("to_account_id").value = id;
  if(kind === "category") document.getElementById("category_id").value = id;
  if(kind === "method") document.getElementById("payment_method").value = id;
  syncLabels(); closeSheet();
});
document.getElementById("receipt")?.addEventListener("change", (e) => {
  const n = document.getElementById("receipt-name");
  const f = e.target.files && e.target.files[0];
  n.hidden = !f;
  n.textContent = f ? f.name : "";
});
(function initCat(){
  const parents = visibleCats().filter(c => !c.parent_id);
  if(parents[0] && !document.getElementById("category_id").value){
    document.getElementById("category_id").value = parents[0].id;
  }
  syncLabels();
})();
</script>
{% endblock %}
