{% extends "base.html" %}
{% block title %}Generator{% endblock %}
{% block content %}
<div class="eyebrow">Password Vault</div>
<div class="page-title">Generator</div>
<div class="surface" style="max-width:520px;">
  <form method="post" action="/admin/passwords/generator">
    <div class="field"><label>Kind</label>
      <select name="kind">
        <option value="password">Password</option>
        <option value="passphrase">Passphrase</option>
      </select>
    </div>
    <div class="form-grid">
      <div class="field"><label>Length</label><input type="text" name="length" value="16"></div>
      <div class="field"><label>Word count</label><input type="text" name="word_count" value="4"></div>
    </div>
    <div style="display:grid; gap:8px; margin:8px 0 16px;">
      <label style="display:flex; gap:10px; align-items:center;"><input type="checkbox" name="uppercase" checked> Uppercase A–Z</label>
      <label style="display:flex; gap:10px; align-items:center;"><input type="checkbox" name="lowercase" checked> Lowercase a–z</label>
      <label style="display:flex; gap:10px; align-items:center;"><input type="checkbox" name="numbers" checked> Numbers 0–9</label>
      <label style="display:flex; gap:10px; align-items:center;"><input type="checkbox" name="symbols" checked> Symbols</label>
    </div>
    <button class="btn" type="submit">Generate</button>
  </form>
  {% if result %}
  <div style="margin-top:20px; padding:18px; background:var(--accent-soft); border:1px solid rgba(91,140,255,0.25); border-radius:14px;">
    <div class="mono" style="font-size:20px; word-break:break-all; font-weight:500;">{{ result.value }}</div>
    <div style="font-size:12px; color:var(--ink-soft); margin-top:8px;">Strength {{ result.score }}/4 · {{ result.length }} characters</div>
  </div>
  {% endif %}
</div>
{% endblock %}
