<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ pack.title }} — Vault</title>
<meta name="theme-color" content="#0B0F17">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');
  body{ font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:#0B0F17; color:#F4F6FA; margin:0; padding:24px; }
  .card{ max-width:560px; margin:0 auto; background:#151B28; border:1px solid rgba(255,255,255,0.08); border-radius:22px; padding:28px; }
  a.btn{ display:inline-block; background:linear-gradient(180deg,#6B98FF,#4E7FFF); color:#fff; text-decoration:none; padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; }
  .row{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.08); gap:12px; }
  .row:last-child{ border-bottom:none; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#8B95A8; font-weight:600;">Shared pack</div>
    <h1 style="letter-spacing:-0.03em; margin:8px 0;">{{ pack.title }}</h1>
    <p style="color:#8B95A8; font-size:13px; margin-bottom:8px;">Expires {{ pack.expires_at.strftime('%d %b %Y, %H:%M') }} UTC · Shared from Health Vault</p>
    {% for doc in docs %}
    <div class="row">
      <div>
        <div style="font-weight:600;">{{ doc.title }}</div>
        <div style="font-size:12px; color:#8B95A8;">{{ doc.hospital_name or '' }} {{ doc.doc_date or '' }}</div>
      </div>
      <a class="btn" href="/share/public/pack/{{ token }}/download/{{ doc.id }}{% if pin %}?pin={{ pin }}{% endif %}">Download</a>
    </div>
    {% else %}
    <p>No documents in this pack.</p>
    {% endfor %}
  </div>
</body>
</html>
