<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ pack.title }} — Vault</title>
<meta name="theme-color" content="#0B1018">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/vault.css?v=4">
<style>
  body{ min-height:100vh; padding:40px 20px; }
  .card{ max-width:560px; margin:0 auto; border:1px solid var(--line); border-radius:var(--radius); padding:40px 36px; }
  h1{ font-family:var(--display); font-size:36px; font-weight:400; font-style:italic; letter-spacing:-0.03em; margin:10px 0 8px; line-height:1.1; }
  .lead{ color:var(--ink-soft); font-size:13px; margin-bottom:20px; line-height:1.5; }
  .row{ display:flex; justify-content:space-between; align-items:center; padding:18px 0; border-bottom:1px solid var(--line); gap:12px; }
  .row:last-child{ border-bottom:none; }
  .meta{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Shared pack</div>
    <h1>{{ pack.title }}</h1>
    <p class="lead">Expires {{ pack.expires_at.strftime('%d %b %Y, %H:%M') }} UTC · Shared from Health Vault</p>
    {% for doc in docs %}
    <div class="row">
      <div>
        <div style="font-weight:600;">{{ doc.title }}</div>
        <div class="meta">{{ doc.hospital_name or '' }} {{ doc.doc_date or '' }}</div>
      </div>
      <a class="btn" href="/share/public/pack/{{ token }}/download/{{ doc.id }}{% if pin %}?pin={{ pin }}{% endif %}">Download</a>
    </div>
    {% else %}
    <p class="lead">No documents in this pack.</p>
    {% endfor %}
  </div>
</body>
</html>
