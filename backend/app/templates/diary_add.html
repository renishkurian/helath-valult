{% extends "base.html" %}
{% block title %}New diary entry{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">
      <a href="/admin/diary"><i class="bi bi-chevron-left"></i> Diary</a>
    </div>
    <h1 class="page-title">New entry</h1>
    <p class="page-lead">A quiet page for the day — title, story, and optional photos.</p>
  </div>
</div>

<div class="diary-desk">
  <form class="diary-desk-card" method="post" action="/admin/diary/add" enctype="multipart/form-data">
    <label class="visually-hidden" for="dy-title">Title</label>
    <input class="form-control title-input" id="dy-title" name="title" required maxlength="255"
           placeholder="What do you want to remember?" autofocus>

    <div class="diary-desk-meta">
      <div>
        <label class="form-label" for="dy-date">Date</label>
        <input class="form-control" id="dy-date" type="date" name="entry_date" value="{{ today }}">
      </div>
      <div>
        <label class="form-label" for="dy-cat">Folder</label>
        <select class="form-select" id="dy-cat" name="category_id">
          <option value="">None</option>
          {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="form-label" for="dy-mood">Mood</label>
        <input class="form-control" id="dy-mood" name="mood" placeholder="Calm, tired…">
      </div>
      <div>
        <label class="form-label" for="dy-tags">Tags</label>
        <input class="form-control" id="dy-tags" name="tags" placeholder="travel, home">
      </div>
    </div>

    <label class="form-label" for="dy-body">Story</label>
    <textarea class="form-control body-input" id="dy-body" name="body" rows="10"
              placeholder="What happened today…"></textarea>

    <div class="mt-3">
      <label class="form-label" for="dy-photos">Photos</label>
      <input class="form-control" id="dy-photos" type="file" name="images" accept="image/*" multiple>
    </div>

    <div class="diary-desk-actions">
      <div class="form-check me-auto">
        <input class="form-check-input" type="checkbox" name="pinned" value="1" id="pinned">
        <label class="form-check-label" for="pinned">Pin to top</label>
      </div>
      <a class="btn btn-ghost" href="/admin/diary">Cancel</a>
      <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save entry</button>
    </div>
  </form>
</div>
{% endblock %}
