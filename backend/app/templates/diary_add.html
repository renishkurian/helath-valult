{% extends "base.html" %}
{% block title %}New diary entry{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">
      <a href="/admin/diary"><i class="bi bi-chevron-left"></i> Diary</a>
    </div>
    <h1 class="page-title">New entry</h1>
    <p class="page-lead">Title, story, category, and optional photos.</p>
  </div>
</div>

<form class="card" method="post" action="/admin/diary/add" enctype="multipart/form-data" style="max-width:720px;">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">Title</label>
      <input class="form-control" name="title" required maxlength="255" placeholder="A day worth remembering">
    </div>
    <div class="col-md-6">
      <label class="form-label">Date</label>
      <input class="form-control" type="date" name="entry_date" value="{{ today }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Category</label>
      <select class="form-select" name="category_id">
        <option value="">None</option>
        {% for c in categories %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="body" rows="8" placeholder="What happened today…"></textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Tags</label>
      <input class="form-control" name="tags" placeholder="travel, birthday">
    </div>
    <div class="col-md-6">
      <label class="form-label">Mood</label>
      <input class="form-control" name="mood" placeholder="Happy, calm, tired…">
    </div>
    <div class="col-12">
      <label class="form-label">Photos</label>
      <input class="form-control" type="file" name="images" accept="image/*" multiple>
    </div>
    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="pinned" value="1" id="pinned">
        <label class="form-check-label" for="pinned">Pin this entry</label>
      </div>
    </div>
    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save entry</button>
      <a class="btn btn-ghost" href="/admin/diary">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
